[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stardew-save-bridge"
version = "0.1.0"
description = "A careful local bridge for Stardew Valley farm saves"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9", "platformdirs>=4.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.9", "mypy>=1.14", "pyinstaller>=6"]

[project.scripts]
stardew-save-bridge = "save_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
save_bridge = ["resources/*.qss", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

